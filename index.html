<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Antes de nosotros</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--cr:#F3EBDD;--pa:#E4D5BC;--br:#49382D;--ol:#85866B;--go:#C6A36A;--ch:#302C29;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ch);color:var(--cr);font:11px/2 "Press Start 2P","Courier New",monospace;overflow:hidden}
button,input,select{font:inherit;font-size:10px}
#stage{height:100%;transition:opacity .25s}
button{color:var(--br);background:var(--go);border:3px solid var(--br);box-shadow:0 4px 0 var(--br);padding:8px 12px;cursor:pointer;line-height:1.6}
button:hover,button:focus-visible{background:var(--cr);outline:3px solid var(--cr)}button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--br)}
input,select{background:var(--cr);color:var(--br);border:3px solid var(--br);padding:7px}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px}
.cv{position:relative;width:min(100%,calc((100dvh - var(--dh,210px))*1.7778));aspect-ratio:16/9;overflow:hidden;border:4px solid var(--br);background:var(--ch)}
.cv>svg{position:absolute;inset:0;width:100%;height:100%}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;overflow:auto;background:linear-gradient(#302C29,#49382D)}
h1{font-size:clamp(16px,4.4vw,38px);line-height:1.5;margin:.3em 0;text-shadow:4px 4px 0 var(--br)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#302C2988;padding:10px;z-index:5}
.sub{max-width:560px;color:var(--pa);line-height:2}
.bk{animation:bl 2s steps(3) infinite}.bk2{animation-delay:.7s}@keyframes bl{50%{opacity:.35}}
.sw{animation:sw 1.6s steps(2) infinite}@keyframes sw{50%{transform:translateY(-1px)}}
.cl{animation:dr 40s linear infinite}@keyframes dr{from{transform:translateX(-60px)}to{transform:translateX(380px)}}
.star{opacity:0;transition:opacity 1s}.night .star{opacity:1;animation:bl 3s steps(3) infinite}
#sk{transition:fill 1s}
.sp{position:absolute;image-rendering:pixelated;filter:drop-shadow(0 3px 0 #0006);animation:bob 1.4s steps(2) infinite;z-index:2;transition:left .6s}.sp.b{animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-1.5%)}}
.ttl{position:absolute;top:6px;left:8px;z-index:4;font-size:9px;line-height:1.8;text-shadow:2px 2px 0 var(--ch);color:var(--cr)}.ttl b{color:var(--go);font-size:11px}
.hot{position:absolute;z-index:4;font-size:8px;padding:5px 7px}
.ht{position:absolute;width:clamp(8px,1.5vw,14px);z-index:3;opacity:0;top:24%}.love .ht{animation:fl 2.8s steps(7) infinite}@keyframes fl{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.dust{position:absolute;bottom:-10px;width:3px;height:3px;background:#F3EBDD;opacity:.6;animation:up linear infinite;pointer-events:none;z-index:3}@keyframes up{to{transform:translateY(-110vh) translateX(30px)}}
.box{width:min(100%,760px);background:var(--cr);color:var(--br);border:5px solid var(--br);box-shadow:0 0 0 3px var(--go);padding:12px;line-height:2;min-height:84px}
.box .row{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap}.note{font-size:9px;color:#6a5748;line-height:1.8}
.clip.on{background:var(--cr)}.clip.on:before{content:"▮▮ ";animation:bl .6s steps(2) infinite}
.cards{display:flex;gap:clamp(10px,4vw,50px);flex-wrap:wrap;justify-content:center;margin:14px 0}
.pick{background:var(--pa);width:170px;padding:10px}.pick img{height:150px;display:block;margin:0 auto 6px;image-rendering:pixelated}
#card{width:min(92vw,400px);background:var(--pa);color:var(--br);border:8px solid var(--br);box-shadow:inset 0 0 0 4px var(--go);padding:16px;text-align:left}
#card .pt{background:var(--cr);border:4px solid var(--br);text-align:center;padding:6px}#card img{height:200px;image-rendering:pixelated}
#card h2{font-size:13px;margin:12px 0 4px;line-height:1.5}#card p{margin:6px 0;font-size:9px;line-height:1.9}#card small{display:block;font-size:7px;color:var(--ol)}
.nb{position:absolute;z-index:4;left:24.4%;top:26.5%;width:28.8%;height:18%;background:#0000;border:3px dashed var(--go);box-shadow:none;animation:bl 1.6s steps(2) infinite;padding:0}.nb:hover{background:#C6A36A44;animation:none}
.nb span{position:absolute;top:-24px;left:-3px;background:var(--br);color:var(--cr);padding:3px 6px;font-size:8px;white-space:nowrap}
.arc{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--ch);padding:10px;gap:8px;overflow:auto;padding-top:52px}
.bc{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:9px}.bc a{color:var(--go);cursor:pointer;text-decoration:underline}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fl{background:var(--pa);color:var(--br);border:4px solid var(--br);padding:8px;font-size:9px;line-height:1.8}
.cov{height:100px;background:repeating-linear-gradient(45deg,#C6A36A 0 8px,#E4D5BC 8px 16px);border:3px solid var(--br);margin-bottom:6px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
iframe{flex:1;width:100%;min-height:300px;border:4px solid var(--go);background:#fff}
#audio{position:fixed;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:30;display:flex;gap:6px;align-items:center}#audio input{width:70px;padding:0;accent-color:#C6A36A}
@media(max-width:600px){.ttl{font-size:7px}.hot{font-size:7px;padding:3px 4px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.sp>img{height:100%;image-rendering:pixelated;display:block}
.bub{position:absolute;bottom:101%;left:50%;transform:translateX(-50%);width:clamp(36px,7.5vw,76px);aspect-ratio:1;background:var(--cr);border:3px solid var(--br);display:flex;align-items:center;justify-content:center}
.bub:after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-4px;border:4px solid transparent;border-top:6px solid var(--br)}
.bub img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;animation:pop .3s steps(3)}@keyframes pop{from{transform:scale(.5)}}
#card{width:min(94vw,430px);padding:10px;background:var(--pa);border:8px solid var(--br);box-shadow:inset 0 0 0 4px var(--go),0 0 0 4px var(--go)}
#card.pop{animation:pop2 .4s steps(4)}@keyframes pop2{from{transform:scale(.85);opacity:0}}
#card .hd{display:flex;justify-content:space-between;background:var(--br);color:var(--go);padding:6px 8px;font-size:8px}
#card .pt{position:relative;margin:8px 0;height:200px;background:repeating-linear-gradient(45deg,#85866B 0 10px,#7c7d62 10px 20px);border:4px solid var(--br);padding:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;text-align:center}
#card .pt img{height:94%;image-rendering:pixelated;background:none;padding:0;border:0}
.spk{position:absolute;width:6px;height:6px;background:#F3EBDD;animation:bl 1.5s steps(2) infinite}
#card .nm{background:var(--br);color:var(--cr);text-align:center;padding:8px;font-size:11px;line-height:1.6}
#card .tg{text-align:center;font-size:8px;color:var(--ol);margin:4px 0 8px}
#card .gr2{display:grid;grid-template-columns:1fr 1fr;gap:6px}#card .gr2>div{background:var(--cr);border:3px solid var(--br);padding:6px;font-size:8px;line-height:1.8;min-height:48px}#card .w2{grid-column:span 2}
#card small{display:block;font-size:7px;color:var(--ol)}
#card .qt{margin:8px 0;border:3px dashed var(--br);padding:8px;font-size:8px;line-height:1.9;text-align:center}
.phd{color:#8a7a68;border-bottom:2px dashed #b8a888}
.nb.al{top:46.8%;height:17%}
.bkb{background:var(--pa)}.bkb:hover{transform:translateX(-3px)}.bkb:active{transform:translate(-2px,3px)}
.dt{display:inline-block;background:var(--br);color:var(--go);padding:1px 6px;margin:2px 6px 2px 0;font-size:9px;border:2px solid var(--go)}
</style></head><body>

 st.innerHTML=`<div class="wrap"><div class="cv" id="cv">${bg}<div class="ttl">CAPÍTULO ${n+1}<br><b>${ch.title}</b></div><div class="sp" id="m" style="left:${pos[0]}%;bottom:6%;height:50%"><div class="bub"><img id="bm" alt=""></div><img src="${C.mother.full}" alt="Mamá"></div><div class="sp b" id="f" style="left:${pos[1]}%;bottom:6%;height:50%"><div class="bub"><img id="bd" alt=""></div><img src="${C.father.full}" alt="Papá"></div>${[0,1,2].map(i=>`<div class="ht" id="h${i}" style="left:${46+(i-1)*3}%;animation-delay:${i*.9}s">${HEART}</div>`).join("")}${fr}${ch.sc=="days"?'<div style="position:absolute;z-index:5;bottom:2%;left:0;right:0;display:flex;gap:4px;justify-content:center" id="cal"></div>':""}${ch.spots.map(s=>`<button class="hot" style="left:${s.x};top:${s.y}" onclick="$('#note').textContent='${s.x2}'">${s.t}</button>`).join("")}</div><div class="box"><div id="tx"></div><div class="note" id="note"></div><div class="row"><button id="bkb" class="bkb" data-s="back">◀ ATRÁS</button><button id="nx" data-s="go"></button></div></div></div>`;
 if(ch.sc=="days"){const cv=$("#cv"),dr=()=>{window.dm=d;$("#cal").innerHTML=Array.from({length:7},(_,i)=>`<button data-s="page" style="padding:5px 6px;font-size:8px;${i<=d?"":"background:var(--pa)"}" onclick="dayTo(${i})">D${i+1}</button>`).join("");
   $("#sk").setAttribute("fill",SKY[d]);$("#sn").setAttribute("transform",`translate(${30+d*43} ${100-Math.sin(d/6*Math.PI)*72})`);$("#sn").firstChild.setAttribute("fill",d==6?"#F3EBDD":"#fbe3a0");
   $("#dk").setAttribute("opacity",[0,0,0,0,.1,.3,.5][d]);cv.classList.toggle("night",d>=5);cv.classList.toggle("love",d>=4);
   $("#m").style.left=22+d*3.2+"%";$("#f").style.left=68-d*2.9+"%";const ce=(22+d*3.2+68-d*2.9)/2+5;[0,1,2].forEach(i=>$("#h"+i).style.left=ce+(i-1)*3+"%")};window.dayTo=i=>{d=i;dr()};dr()}
 const show=()=>{const s=ch.steps[k],last=k==ch.steps.length-1;$("#note").textContent="";setEx(EM[n][k]);
  if(s.n)$("#tx").innerHTML=s.n;else{$("#tx").innerHTML=`<button class="clip" id="cb">▶ ${s.c.l}</button>`;$("#cb").onclick=e=>playC(e.currentTarget,s.c.src,$("#note"))}
  $("#nx").textContent=last?(n<2?"CAPÍTULO "+(n+2)+" ▶":"CONTINUAR ▶"):"SIGUIENTE ▶";
  $("#nx").onclick=()=>{stopA();if(!last){k++;show()}else if(n<2)go("chapter",n+1);else go("transition")}};$("#bkb").onclick=()=>{stopA();if(k>0){k--;show()}else if(n>0){window.bk=CFG.chapters[n-1].steps.length-1;go("chapter",n-1)}else go("characterIntroduction")};show()},
transition(){st.innerHTML=`<div class="scr">${dustH()}<p style="max-width:600px;line-height:2.4;font-size:12px">${CFG.transitionText}</p><br><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button data-s="back" onclick="window.bk=CFG.chapters[2].steps.length-1;go('chapter',2)">◀ ATRÁS</button><button data-s="open" onclick="go('library')">ENTER THE LIBRARY</button></div></div>`},
library(){st.innerHTML=`<div class="wrap" style="--dh:30px"><div class="cv">${libB()}<div class="ttl">LA BIBLIOTECA</div><button class="nb" data-s="open" onclick="go('archive',{c:'cuadernos',lv:'folder'})" aria-label="Abrir CUADERNOS"><span>▶ CUADERNOS</span></button><button class="nb al" data-s="open" onclick="go('archive',{c:'albumes',lv:'folder'})" aria-label="Abrir ÁLBUMES"><span>▶ ÁLBUMES</span></button><button style="position:absolute;z-index:4;left:6px;bottom:6px;font-size:8px" data-s="back" onclick="go('welcome')">◀ INICIO</button></div></div>`},
archive(o){const cat=CATS[o.c],items=cat.items(),go2=l=>`go('archive',{c:'${o.c}',lv:'${l}'})`,bc=x=>`<div class="bc"><a onclick="go('library')">BIBLIOTECA</a>›<a onclick="${go2("folder")}">${cat.name}</a>${x}</div>`,W=b=>`<div class="wrap" style="--dh:30px"><div class="cv" style="aspect-ratio:auto;height:calc(100dvh - 30px)"><div class="arc">${b}</div></div></div>`;
 if(o.lv=="folder"){st.innerHTML=W(bc("")+`<div class="tb"><button data-s="back" onclick="go('library')">◀ ATRÁS</button></div><p class="sub">${cat.name} · 1 carpeta</p><div class="grid"><button class="fl" data-s="open" onclick="${go2("files")}" style="font-size:10px"><div class="cov" style="background:none;border:0">${PXI.fo()}</div>${cat.folder}<br><small style="color:#6a5748">${items.length} archivos</small></button></div>`);return}
 st.innerHTML=W(bc(`›<span>${cat.folder}</span>`)+`<div class="tb"><button data-s="back" onclick="${go2("folder")}">◀ ATRÁS</button><input id="q" placeholder="BUSCAR TÍTULO" aria-label="Buscar por título"><select id="so" aria-label="Ordenar"><option value="a">CRONOLÓGICO ↑</option><option value="d">CRONOLÓGICO ↓</option><option value="t">TÍTULO A-Z</option></select>${CFG.playlist?`<a href="${CFG.playlist}" target="_blank" rel="noopener" style="color:var(--go)">♪ PLAYLIST</a>`:""}</div><div class="grid" id="gd"></div>`);
 const dr=()=>{const q=$("#q").value.toLowerCase(),so=$("#so").value;let l=items.filter(x=>x.title.toLowerCase().includes(q));l.sort((a,b)=>so=="t"?a.title.localeCompare(b.title):so=="d"?b.order-a.order:a.order-b.order);
  $("#gd").innerHTML=l.length?l.map(x=>`<div class="fl"><div class="cov" style="${x.cover?`background-image:url('${x.cover}')`:"background:var(--cr)"}">${x.cover?"":PXI[cat.ico]()}</div><b>${x.title}</b><br>${[x.author,x.period||x.date].filter(Boolean).join(" · ")}${[x.author,x.period||x.date].some(Boolean)?"<br>":""}${x.description?`<small style="color:#6a5748">${x.description}</small><br>`:""}[${x.format}]<br><button style="margin-top:6px" data-s="open" onclick="SC.bookViewer({c:'${o.c}',id:'${x.id}'})">ABRIR</button></div>`).join(""):`<p class="sub">${items.length?"Sin resultados.":"Este archivo está vacío. Añade entradas en el arreglo «"+(o.c=="albumes"?"albums":"notebooks")+"»."}</p>`};
 $("#q").oninput=dr;$("#so").onchange=dr;dr()},
bookViewer(o){const cat=CATS[o.c],x=cat.items().find(n=>n.id==o.id),u=x.heyzineUrl||x.fileUrl,go2=l=>`go('archive',{c:'${o.c}',lv:'${l}'})`;
 st.innerHTML=`<div class="wrap" style="--dh:30px"><div class="cv" style="aspect-ratio:auto;height:calc(100dvh - 30px)"><div class="arc"><div class="bc"><a onclick="go('library')">BIBLIOTECA</a>›<a onclick="${go2("folder")}">${cat.name}</a>›<a onclick="${go2("files")}">${cat.folder}</a>›<span>${x.title}</span></div><div class="tb"><button data-s="back" onclick="${go2("files")}">◀ ATRÁS</button><button data-s="back" onclick="go('library')">✕ CERRAR</button></div>${u?`<iframe src="${u}" allowfullscreen title="${x.title}"></iframe><a style="color:var(--go)" href="${u}" target="_blank" rel="noopener">¿NO CARGA? ABRIR EN PESTAÑA NUEVA</a>`:`<p class="sub" style="margin:auto">[Este documento aún no tiene heyzineUrl ni fileUrl.]</p>`}</div></div></div>`}};
